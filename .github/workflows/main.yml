name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Pylint
        run: >-
          uv run pylint
          --ignored-modules=PyQt6.QtWidgets,PyQt6.QtGui
          --disable=no-name-in-module,fixme,redefined-builtin,redefined-outer-name,unspecified-encoding,unused-variable,unnecessary-semicolon
          src

      - name: Run tests
        run: uv run coverage run --branch -m pytest

      - name: Report unit test coverage
        run: uv run coverage report --include='src/modules/*.py'

      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Run Robot Framework story tests
        run: uv run robot --outputdir /tmp/robot-results src/tests/robot
        env:
          QT_QPA_PLATFORM: offscreen
